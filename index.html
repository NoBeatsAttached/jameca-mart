<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
/* VOICE: late-night 1994 South Central, played like a Super Famicom RPG
   IDEA: a handheld console in your hands - screen up top, candy-paint plastic pad below
   PICTURE: a pixel corner store, palms and power lines against an LA night sky
   COLOUR and TYPE: indigo night, candy purple plastic, teal + orange store colours; VT323 text, Permanent Marker logo
   LAYOUT: screen fills the width, controls fill the rest; FF4 blue windows sit over the screen */
:root{color-scheme:dark;--u:1.875}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0d0818;overflow:hidden}
body{font-family:'VT323',ui-monospace,monospace;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:radial-gradient(120% 70% at 50% 0%,#40205f 0%,#1b0d30 55%,#0d0818 100%)}
#bezel{margin-top:10px;padding:10px 10px 6px;background:linear-gradient(#2a1742,#1d1030);border-radius:12px 12px 34px 12px;box-shadow:0 2px 0 #4d2a78 inset,0 12px 30px #0008}
#screen{position:relative;width:calc(var(--u)*192px);height:calc(var(--u)*256px);background:#000;overflow:hidden;border-radius:3px;box-shadow:0 0 0 2px #000}
#cv{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#logo{font:15px 'Permanent Marker',cursive;color:#ff8a1f;text-align:center;margin-top:5px;letter-spacing:.5px;text-shadow:0 2px 0 #0008}
#logo span{color:#20c0b0}
.win{position:absolute;background:linear-gradient(180deg,#3448d8,#16208a 70%,#0c1262);border:calc(var(--u)*1.4px) solid #f2f2f2;border-radius:calc(var(--u)*3px);box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000;font-size:calc(var(--u)*10px);line-height:1.02;padding:calc(var(--u)*3px) calc(var(--u)*5px);text-shadow:calc(var(--u)*.6px) calc(var(--u)*.6px) 0 #000;z-index:2}
#msg{text-align:center;z-index:4}
#dlg{z-index:5}
#dlg .more{float:right;animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(2px)}}
#list{z-index:6;overflow-y:auto;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
.lt{color:#9fb4ff;margin-bottom:2px}
.li{display:flex;justify-content:space-between;gap:6px;padding:calc(var(--u)*1px) 0 calc(var(--u)*1px) calc(var(--u)*9px);position:relative;cursor:pointer;white-space:nowrap}
.li b{font-weight:400;color:#cfd8ff}
.li.on::before{content:'';position:absolute;left:0;top:50%;width:0;height:0;border:calc(var(--u)*3.5px) solid transparent;border-left:calc(var(--u)*5px) solid #fff;transform:translateY(-50%)}
.li.dis{color:#7f88b8}
#ewin div{padding:1px 0}
#ewin .hl{color:#ffe36b}
.pm{margin-bottom:calc(var(--u)*2px)}.pm.cur>.row:first-child span:first-child{color:#ffe36b}.pm.tg>.row:first-child span:first-child{color:#7ff0e0}.pm.ko{color:#8a90b8}
#swin .bar{margin:1px 0 1px}
.row{display:flex;justify-content:space-between}
.bar{height:calc(var(--u)*3px);background:#0a0f40;border:1px solid #000;margin:2px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(#9cffb0,#2fbf5a)}
.bar.mp i{background:linear-gradient(#a6e6ff,#3a8fe0)}
.low{color:#ffe36b}
.tag{color:#ffb36b}
#hud{font-size:calc(var(--u)*8.5px);line-height:1.1}#hud .obj{color:#ffe36b}
#ov{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;pointer-events:none;text-align:center}
#ov h1{margin:calc(var(--u)*16px) 0 0;font:calc(var(--u)*30px)/.9 'Permanent Marker',cursive;color:#ff8a1f;text-shadow:calc(var(--u)*1.5px) calc(var(--u)*1.5px) 0 #2a0f40,0 0 calc(var(--u)*8px) #ff8a1f88;transform:rotate(-4deg)}
#ov h2{margin:calc(var(--u)*4px) 0 0;font-size:calc(var(--u)*11px);font-weight:400;color:#7ff0e0;text-shadow:1px 1px 0 #000;letter-spacing:.5px}
#ov p{margin:calc(var(--u)*4px) calc(var(--u)*10px) 0;font-size:calc(var(--u)*9px);color:#e9dcff;text-shadow:1px 1px 0 #000}
#ov .foot{position:absolute;bottom:calc(var(--u)*4px);left:0;right:0}
#upd{z-index:8;text-align:center;cursor:pointer;background:linear-gradient(180deg,#ffb45a,#e06a00);animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.25)}}
#ver{position:absolute;right:calc(var(--u)*3px);bottom:calc(var(--u)*2px);font-size:calc(var(--u)*7px);color:#fff8;z-index:3;pointer-events:none}
#toast{position:absolute;left:50%;top:calc(var(--u)*30px);transform:translateX(-50%);z-index:9;white-space:nowrap}
#pad{flex:1;width:100%;max-width:440px;min-height:180px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;padding:4px 18px 16px}
#dpad{width:132px;height:132px;position:relative;touch-action:none}
#dpad i{position:absolute;background:#170d22;box-shadow:inset 0 -4px 0 #07040c,0 2px 0 #3c2a52}
#dpad .h{left:0;right:0;top:44px;height:44px;border-radius:9px}
#dpad .v{top:0;bottom:0;left:44px;width:44px;border-radius:9px}
#dpad .c{left:50px;top:50px;width:32px;height:32px;border-radius:50%;background:#0f0818;box-shadow:inset 0 2px 4px #000}
#dpad b{position:absolute;width:0;height:0;border:8px solid transparent;opacity:.55;z-index:1}
#dpad .au{left:58px;top:8px;border-bottom:10px solid #b9a4dc;border-top:0}
#dpad .ad{left:58px;bottom:8px;border-top:10px solid #b9a4dc;border-bottom:0}
#dpad .al{top:58px;left:8px;border-right:10px solid #b9a4dc;border-left:0}
#dpad .ar{top:58px;right:8px;border-left:10px solid #b9a4dc;border-right:0}
#dpad b.on{opacity:1;filter:drop-shadow(0 0 4px #ff8a1f)}
#mid{display:flex;gap:18px;justify-content:center;align-self:end;margin-bottom:8px}
.pill{border:0;padding:8px 12px;min-height:44px;min-width:58px;border-radius:22px;background:#170d22;color:#c7b4e6;font:16px 'VT323',monospace;box-shadow:0 2px 0 #3c2a52;transform:rotate(-10deg);touch-action:none;white-space:nowrap}
#ab{display:flex;gap:12px;align-items:center;transform:rotate(-18deg)}
.btn{width:66px;height:66px;border-radius:50%;border:0;font:30px 'VT323',monospace;color:#fff;text-shadow:0 2px 0 #0006;touch-action:none;box-shadow:0 4px 0 #0008}
#bA{background:radial-gradient(circle at 35% 30%,#ffc78a,#ff8a1f 48%,#b85500);margin-top:-34px}
#bB{background:radial-gradient(circle at 35% 30%,#8ff5e6,#18a598 48%,#0b6058);margin-top:20px}
.btn.on,.pill.on{transform:translateY(3px) scale(.95);filter:brightness(1.2);box-shadow:0 1px 0 #0008}
.pill.on{transform:rotate(-10deg) translateY(3px)}
button:focus-visible{outline:2px solid #ffe36b;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#dlg .more,#upd{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="bezel">
    <div id="screen">
      <canvas id="cv" width="192" height="256"></canvas>
      <div id="ov"></div>
      <div id="hud" class="win" hidden></div>
      <div id="msg" class="win" hidden></div>
      <div id="ewin" class="win" hidden></div>

    <div id="dpad" aria-label="Direction pad"><i class="h"></i><i class="v"></i><i class="c"></i><b class="au"></b><b class="ad"></b><b class="al"></b><b class="ar"></b></div>

  </div>
</div>
<script>
{

pos(msgEl,[4,4,184]);pos(dlgEl,[4,192,184,60]);pos(ewin,[2,152,72,100]);pos(swin,[76,152,114,100]);pos(hud,[3,222,186]);pos($('upd'),[26,4,140]);

/* ---------- story + data ---------- */
const HOURS=['10:00 PM','11:00 PM','12:00 AM','1:00 AM','2:00 AM','3:00 AM','4:00 AM','5:00 AM','6:00 AM'];

const NIGHTS=[
 {day:'MONDAY',d3:'MON',t:'Clocking In',boss:['marcus'],

  intro:[`MONDAY NIGHT. 10:00 PM. Clocked in.`,`MR. DEE (on the phone): "Somebody been messing with stores on this block. Nobody runs up in mine. Hold it down til 6."`,`Shelves, coolers and the hot dog roller restock every hour. Sparkles show what's ready. Walk up and press A.`,`You can step out to the lot, the alley and Florence Ave. The night crew is out there too. Register = save.`],

  pool:[['mask','mask'],['chain','mask'],['brick','chain'],['mask','brick','loc'],['tank','chain'],['chain','chain','mask'],['brick','brick'],['mask','dice','mask']],

const DAYDEF=[
 {start:['ave',2,5,'right'],lines:[`SOUTH CENTRAL, LOS ANGELES. 1994.`,`MONDAY. 9:30 PM. Florence Ave.`,`JAMEKAS: "Five more shifts and that SP-1200 in Benny's window is mine."`,`Shift starts at 10. JAMECA-MART is down the block, east on Florence. D-pad to walk, A to talk.`],obj:[['arrive','Get to work: JAMECA-MART (walk east)']]},

 {start:['store',9,11,'up'],lines:[`THURSDAY MORNING.`,`A letter is taped to the door. SINCLAIR DEVELOPMENT. A cash offer for the store.`,`MR. DEE: "I told him where he could put his offer."`,`KEISHA: "Deacon said Sinclair sends a 'Collector.' Somebody on Florence had to see him."`],obj:[['rosa','Ask Tia Rosa (taco truck) about the town car'],['benny','Ask Benny at the pawn shop']]},
 {start:['store',9,11,'up'],lines:[`FRIDAY MORNING.`,`Jamekas's pager goes off. 911. A number he doesn't know.`,`It's Big Money Marcus. "Meet me at the park. Come alone. Or don't, whatever."`],obj:[['marcus','Meet Marcus at Florence Park (east end)']]}

const KEI_L=[[],[`KEISHA: "You really eat the roller hot dogs? Medically speaking... wow."`],[`KEISHA: "Anatomy final is tomorrow and I'm studying by flashlight. Love this job."`],[`KEISHA: "If they buy the store, they gotta buy me out too. And I'm expensive."`],[`KEISHA: "After tonight I'm sleeping for three days."`]];

 if(P.lv>lv0){fullHeal();SFX.lvl();upd();await say(`LEVEL UP! LV ${P.lv}. Party fully restored.`,1500);for(const id of party())for(const s of SK[id])if(s.lv>lv0&&s.lv<=P.lv)await say(`${NAME[id]} learned ${s.n}!`,1200)}
 if(B.boss)return nightEnd();
 if(MAPID==='alley')P.alleyW=(P.alleyW||0)+1;let lines=null;if(B.day){P.steps=rnd(6,10);save();enterWorld(P.rq===1&&MAPID==='alley'?[`Alley cleared for Tia Rosa: ${Math.min(3,P.alleyW)}/3`]:null);return}
 P.fh++;if(P.fh>=2){P.fh=0;P.hour++;lines=[`${HOURS[P.hour]}. Shelves restocked.`];if(P.hour>=7){lines.push('The street goes quiet. Too quiet. Somebody big is on the way... stock up.');P.steps=rnd(10,14)}}else P.steps=rnd(6,12);save();enterWorld(lines)}
async function lose(){B.ended=true;song=null;SFX.bad();await say('The party got jumped...',1500);msgEl.hidden=true;ewin.hidden=swin.hidden=true;scene='gameover';ov.innerHTML='<h1 style="color:#ff5f7a">GOT JUMPED</h1><h2>The night crew got the best of you.</h2><p>Run it back from your last save with full HP and MP.</p>';openList({box:[52,186,88],items:[{label:'RUN IT BACK'},{label:'TITLE'}],pick:i=>{closeList();if(i===0)retry();else toTitle()}})}
function retry(){const s=loadSave();if(!s){newGame();return}P=s.P;MAPID=P.map||'store';PL.x=PL.tx=s.x;PL.y=PL.ty=s.y;PL.moving=false;PL.dir='down';fullHeal();fadeA=1;if(P.phase==='day'){enterWorld([`${NIGHTS[P.night].day}${P.night===0?' EVENING':' MORNING'}. Back at it.`]);return}P.steps=P.hour>=7?rnd(10,14):rnd(7,12);enterWorld([`${NIGHTS[P.night].day}, ${HOURS[P.hour]}. Back on the clock.`])}
function drawBattle(dt){cx.save();if(B.shake>0){B.shake-=dt;cx.translate(rnd(-2,2),rnd(-2,2))}cx.fillStyle='#000';cx.fillRect(-4,-4,200,264);cx.drawImage(B.bg,0,0);
 const ord=B.en.slice().sort((a,b)=>a.y-b.y);for(const e of ord){if(e.dead){e.alpha-=dt*1.6;if(e.alpha<=0)continue}cx.globalAlpha=Math.max(0,e.alpha);cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(e.x+e.w*.2,e.y+e.h-3,e.w*.6,3);const fl=e.flash>0&&Math.floor(e.flash*30)%2===0;e.flash-=dt;cx.drawImage(fl||e.dead?e.wimg:e.img,Math.round(e.x+e.off),e.y,e.w,e.h);if(e.dead){cx.globalAlpha=Math.max(0,e.alpha-.4);cx.drawImage(e.img,Math.round(e.x),e.y,e.w,e.h)}e.off*=.82;cx.globalAlpha=1}
 for(const m of B.pm){m.jx*=.85;const sp=PSPR[m.id];const fl=m.flash>0&&Math.floor(m.flash*30)%2===0;m.flash-=dt;cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(m.x+10,m.y+45,30,3);if(m.ko){cx.save();cx.globalAlpha=.55;cx.translate(m.x+24,m.y+40);cx.rotate(-Math.PI/2);cx.drawImage(sp[0],-20,-24,48,48);cx.restore()}else cx.drawImage(fl?sp[1]:(m.hp<m.mhp*.25?sp[2]:sp[0]),Math.round(m.x+m.jx),m.y,48,48);if(B.cur===m&&!B.tg){cx.fillStyle='#ffe36b';cx.fillRect(m.x+22,m.y-4+Math.round(Math.sin(performance.now()/150)),5,2)}}
 if(B.tg){const t=B.tg.list[B.tg.i];if(t)cx.drawImage(HAND,Math.round(t.x-10+Math.sin(performance.now()/120)*1.5),Math.round(t.y+t.h*.4))}
 cx.font='14px VT323, monospace';cx.textAlign='center';B.pops=B.pops.filter(p=>p.a<1.1);for(const p of B.pops){p.a+=dt;const y=p.y-Math.min(p.a,.25)*40+(p.a>.25?Math.min(p.a-.25,.1)*30:0);cx.fillStyle='#000';[[-1,0],[1,0],[0,-1],[0,1]].forEach(([a,b])=>cx.fillText(p.t,p.x+a,y+b));cx.fillStyle=p.c;cx.fillText(p.t,p.x,y)}cx.textAlign='left';cx.restore()}

/* ---------- nights, days, shop ---------- */
function startDay(n,lines){const D=DAYDEF[n];P.phase='day';P.hour=8;P.obj=D.obj.map(([id,t])=>({id,t,done:false}));const s=D.start;MAPID=s[0];P.map=MAPID;PL.x=PL.tx=s[1];PL.y=PL.ty=s[2];PL.dir=s[3];PL.moving=false;fadeA=1;save();enterWorld((lines||[]).concat(D.lines))}
function startNight(){const N=NIGHTS[P.night];P.phase='night';P.hour=0;P.fh=0;P.steps=rnd(7,11);fullHeal();MAPID='store';P.map='store';PL.x=PL.tx=9;PL.y=PL.ty=10;PL.dir='up';PL.moving=false;save();
 scene='card';closeList();ov.innerHTML=`<h2 style="margin-top:calc(var(--u)*80px)">NIGHT ${P.night+1}${P.ng?' (NG+'+P.ng+')':''}</h2><h1>${N.day}</h1><h2>${N.t.toUpperCase()}</h2>`;hud.hidden=true;playSong(null);setTimeout(()=>{ov.innerHTML='';fadeA=1;enterWorld(N.intro)},2200)}
function nightEnd(){const n=P.night;msgEl.hidden=true;ewin.hidden=swin.hidden=true;if(n>=4){ending();return}
 P.night=n+1;const D=DAYDEF[P.night];if(D.cash)P.cash+=D.cash;fullHeal();B=null;startDay(P.night,NIGHTS[n].out)}
function gearShop(){const cats=['jw','ja'].concat(P.kei?['kw','ka']:[]);const maxT=Math.min(4,P.night+1);
 openList({box:[4,40,184],title:`UNCLE RAY'S GEAR. You have $${P.cash}`,items:cats.map(c=>({c,label:GEARN[c],right:GEAR[c][P.gear[c]][0]})),back:closeList,pick:(i,it)=>gearTier(it.c,maxT)})}
function gearTier(c,maxT){const items=GEAR[c].slice(1,maxT+1).map((g,ix)=>{const t=ix+1,own=P.gear[c]>=t;return{t,label:`${g[0]} +${g[1]}`,right:own?(P.gear[c]===t?'EQUIPPED':'OWNED'):'$'+g[2],dis:own||P.cash<g[2],why:own?'Already got it':'Not enough cash'}});
 openList({box:[4,40,184],title:`${GEARN[c]} ($${P.cash}). More tiers unlock each day.`,items,back:gearShop,pick:(i,it)=>{const g=GEAR[c][it.t];P.cash-=g[2];P.gear[c]=it.t;fullHeal();SFX.buy();toast(`EQUIPPED ${g[0].toUpperCase()}`);save();upd();gearTier(c,maxT)}})}
function buyList(title,keys,back){const items=keys.map(k=>({k,label:IT[k].n,right:`$${IT[k].c} (x${P.inv[k]||0})`,dis:P.cash<IT[k].c||(P.inv[k]||0)>=9,why:(P.inv[k]||0)>=9?'Pockets full':'Not enough cash'}));
 openList({box:[4,40,184,140],title:`${title} You have $${P.cash}`,items,back,hover:j=>toast(IT[items[j].k].d),pick:(i,it)=>{P.cash-=IT[it.k].c;P.inv[it.k]=(P.inv[it.k]||0)+1;SFX.buy();save();upd();buyList(title,keys,back);L.i=i;renderList()}})}
const snackShop=()=>buyList('AUNTIE PEARL\'S SNACKS.',['chips','hotdog','burrito','soda','slushie','spray','scratch'],closeList);
const tacoShop=()=>buyList('TIA ROSA\'S TRUCK.',['taco','horch','plate'],closeList);
function ending(){scene='ending';B=null;P.phase='done';playSong(WORLD);hud.hidden=true;const end=ENDING.slice();end.splice(4,0,P.sp?'And the SP-1200? Jamekas made a beat tape on it called GRAVEYARD SHIFT. Benny bought the first copy.':'The SP-1200 is still sitting in Benny\'s window. Next paycheck. For real this time.');
 dialog(NIGHTS[4].out.concat(end),()=>{ov.innerHTML=`<h1>SHIFT OVER</h1><h2>JAMEKAS &amp; KEISHA HELD IT DOWN</h2><p>LV ${P.lv} &middot; $${P.cash}${P.sp?' &middot; SP-1200 OWNED':''}</p><p>Thanks for playing.</p>`;try{localStorage.removeItem(SAVEKEY)}catch(e){}
 openList({box:[50,170,92],items:[{label:'NEW GAME+'},{label:'TITLE'}],pick:i=>{closeList();if(i===0){P.ng++;P.night=0;P.walt=-1;P.rq=P.rq||0;ov.innerHTML='';startDay(0)}else toTitle()}})})}
/* ---------- title ---------- */
function toTitle(){scene='title';B=null;hud.hidden=true;msgEl.hidden=true;ewin.hidden=swin.hidden=true;const has=!!loadSave();
 ov.innerHTML=`<h1>JAMEKAS</h1><h2>GRAVEYARD SHIFT AT JAMECA-MART</h2><p>${gpBlocked?'Controller blocked in this viewer. Open the page in your browser.':'Bluetooth controller? Pair it, then press any button.'}</p>`;
 playSong(WORLD);openList({box:[56,160,80],items:[{label:'NEW GAME'},{label:'CONTINUE',dis:!has,why:'No save yet'},{label:'SOUND'}],i:has?1:0,pick:i=>{if(i===2){soundMenu(toTitle);return}closeList();if(i===0)newGame();else retry()}})}
function newGame(){P=newP();ov.innerHTML='';startDay(0)}

/* ---------- in-app updates (no manual refresh) ---------- */
let newVer=null;
async function checkUpdate(manual){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(String(j.v)!==VERSION){newVer=String(j.v);$('upd').hidden=false;if(manual)doUpdate()}else if(manual)toast('UP TO DATE (v'+VERSION+')')}catch(e){if(manual)toast("CAN'T CHECK FOR UPDATES HERE")}}
function doUpdate(){if(scene==='battle'||scene==='trans'){toast('FINISH THE FIGHT FIRST');return}if(scene==='world'&&P)save();toast('UPDATING...');setTimeout(()=>{const u=location.pathname+'?v='+encodeURIComponent(newVer||Date.now())+location.hash;try{location.replace(u)}catch(e){location.reload()}},300)}
$('upd').addEventListener('pointerdown',e=>{e.stopPropagation();doUpdate()});
$('ver').textContent='v'+VERSION;
setTimeout(()=>checkUpdate(false),1500);setInterval(()=>checkUpdate(false),90000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;pollPad();
 if(scene==='world'){updWorld(dt);drawWorld(now,dt)}
 else if(scene==='trans'){transT+=dt;drawWorld(now,0);if(Math.floor(transT*14)%2){cx.fillStyle='rgba(255,255,255,.75)';cx.fillRect(0,0,192,256)}const bh=Math.max(0,(transT-.4)/.4)*128;cx.fillStyle='#000';cx.fillRect(0,0,192,bh);cx.fillRect(0,256-bh,192,bh);if(transT>.85)startBattle(transBoss)}
 else if(scene==='battle'&&B)drawBattle(dt);
 else if(scene==='title')drawFront(0,now/1000);
 else if(scene==='day'||scene==='ending')drawFront(8,now/1000);
 else if(scene==='card'){cx.fillStyle='#0b0618';cx.fillRect(0,0,192,256)}
 else if(scene==='gameover'){cx.fillStyle='#12040c';cx.fillRect(0,0,192,256)}
 if(dirty){dirty=false;if(P&&scene==='world')hudText();bui()}
 requestAnimationFrame(loop)}

try{navigator.getGamepads&&navigator.getGamepads()}catch(e){gpBlocked=true}
const go=()=>{toTitle();requestAnimationFrame(loop)};
if(document.fonts&&document.fonts.load)Promise.race([Promise.all([document.fonts.load('20px VT323'),document.fonts.load('20px "Permanent Marker"')]),wait(1500)]).then(go,go);else go();
}

</script>
